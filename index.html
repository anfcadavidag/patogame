<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pato de Hule</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0d14; overflow: hidden; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: auto; box-shadow: 0 0 40px rgba(0,0,0,.6); }
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  .tbtn {
    position: absolute; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 72px; height: 72px; border-radius: 50%;
    background: rgba(255,255,255,.22); border: 2px solid rgba(255,255,255,.5);
    color: #fff; font: bold 30px sans-serif; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .tbtn.on { background: rgba(255,255,255,.45); }
  .tbtn.small { width: 48px; height: 48px; font-size: 20px; left: 50%; transform: translateX(-50%); }
  #rotate {
    position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    padding: 8px 14px; border-radius: 20px; background: rgba(0,0,0,.7); color: #ffd21f;
    font: bold 14px 'Trebuchet MS', Verdana, sans-serif; white-space: nowrap; pointer-events: none; display: none;
  }
  @media (orientation: portrait) { body.touch #rotate { display: block; } }
</style>
</head>

  <div class="tbtn" data-k="fire" style="right:100px">🔥</div>

</div>

<script>
// =====================================================================
//  CONFIGURACIÓN — agrega aquí las frases nuevas del pato
// =====================================================================
const FRASES_BOTON = [

const FRASE_MUERTE = "¡No me la hagas!";
// Con el skin de italiano el pato solo dice estas frases al coger el primer botón

const VIDAS_INICIALES = 5;
// Mundos donde dos gaticos esperan al pato junto a la meta (0 = mundo 1)
const MUNDOS_CON_GATICOS = [0];

// Skin del pato en cada mundo (en orden: mundo 1 … mundo 8). Puedes reordenarlos.
const SKIN_POR_MUNDO = ['medico', 'italiano', 'vaquero', 'batman', 'playero', 'esquimal', 'bombero', 'astronauta'];
const SKIN_NOMBRES = {
  medico: 'Pato Médico', italiano: 'Pato Italiano', vaquero: 'Pato Vaquero', batman: 'Pato Batman',
  playero: 'Pato Playero', esquimal: 'Pato Esquimal', bombero: 'Pato Bombero', astronauta: 'Pato Anti-Radiación',
};

// =====================================================================
//  Constantes
// =====================================================================
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 960, H = 544, T = 32, ROWS = 17;
const GRAV = 0.55, MAXFALL = 12, JUMP = -12.4, MAXV = 4.6;
const FONT = "'Trebuchet MS', 'Arial Rounded MT Bold', Verdana, sans-serif";

const THEMES = [
  { name: 'Prado Burbuja',      sky: ['#6ec6ff', '#d6f1ff'], ground: '#5bc236', dirt: '#9a6232', dirt2: '#86532a', brick: '#c9602f', block: '#b98a52', pipe: '#2fa84f', far: '#8fd37a', near: '#4fae3a', deco: 'hills',   clouds: true, sun: '#fff3a0' },
  { name: 'Florencia',          sky: ['#79b4e3', '#f7e2c0'], ground: '#b8a78c', dirt: '#8c6d4f', dirt2: '#7a5e43', brick: '#c1502e', block: '#cdbb98', pipe: '#3f6f4f', far: '#8fa66a', near: '#d9a45b', deco: 'florence', clouds: true, sun: '#fff1c4', pit: 'water', goal: 'duomo' },
  { name: 'Desierto Jabonoso',  sky: ['#f7b85e', '#fde7b8'], ground: '#e8c063', dirt: '#c48b41', dirt2: '#b07a36', brick: '#cf7440', block: '#c9a26a', pipe: '#2fa84f', far: '#f0cf86', near: '#4f9a4a', deco: 'cactus',  sun: '#fff6d0' },
  { name: 'Cueva Goteante',     sky: ['#15122a', '#35305a'], ground: '#7c79a3', dirt: '#48436b', dirt2: '#3d3960', brick: '#6c5bd1', block: '#6d6a92', pipe: '#8a4fd1', far: '#2a2548', near: '#47d6ff', deco: 'crystals', amb: 'drip' },
  { name: 'Playa Tina',         sky: ['#3fb8f5', '#bfeaff'], ground: '#f5dd92', dirt: '#d3aa62', dirt2: '#c29a55', brick: '#e3874a', block: '#d9b77a', pipe: '#ff6f91', far: '#1e8fd6', near: '#3f9a3a', deco: 'palms',   clouds: true, sun: '#fff7c2', pit: 'water' },
  { name: 'Glaciar Resbaloso',  sky: ['#8fbde6', '#eef7ff'], ground: '#f4fbff', dirt: '#a9cfe6', dirt2: '#96c0da', brick: '#7fb0d6', block: '#b8d8ee', pipe: '#4a90c2', far: '#c9def0', near: '#2f6d57', deco: 'snow',    clouds: true, ice: true, pit: 'ice', amb: 'snow' },
  { name: 'Volcán Hirviente',   sky: ['#2b0a0a', '#9b2f1a'], ground: '#5a3a33', dirt: '#33201c', dirt2: '#2a1916', brick: '#8a3322', block: '#5e4a44', pipe: '#6d6d6d', far: '#1f0d0d', near: '#3a2420', deco: 'volcano', pit: 'lava', amb: 'ember' },
  { name: 'Planta Radiactiva',  sky: ['#07140a', '#1c3a1e'], ground: '#4c6b45', dirt: '#263823', dirt2: '#1f2f1d', brick: '#5d6b34', block: '#55614f', pipe: '#9aa33a', far: '#11261a', near: '#c4d82e', deco: 'factory', pit: 'toxic', amb: 'toxic', goal: 'rave' },
];

// =====================================================================
//  Utilidades
// =====================================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function overlap(a, b, m = 0) {
  return a.x + m < b.x + b.w && a.x + a.w - m > b.x && a.y + m < b.y + b.h && a.y + a.h - m > b.y;
}
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function txt(s, x, y, size, color = '#fff', align = 'center', stroke = '#1a1a1a') {
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if (stroke) { ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function store(key, val) {
  try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; }
}

// =====================================================================
//  Sonido (WebAudio)
// =====================================================================
let AC = null, muted = false;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type = 'square', vol = 0.06, slideTo = null, delay = 0) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
const SFX = {
  jump:  () => tone(330, 0.15, 'square', 0.05, 660),
  coin:  () => { tone(988, 0.08, 'square', 0.04); tone(1319, 0.22, 'square', 0.04, null, 0.08); },
  stomp: () => tone(220, 0.12, 'triangle', 0.12, 70),
  bump:  () => tone(120, 0.08, 'square', 0.07, 80),
  brk:   () => tone(200, 0.15, 'sawtooth', 0.06, 50),
  fire:  () => tone(900, 0.12, 'sawtooth', 0.035, 200),
  kill:  () => tone(600, 0.15, 'square', 0.05, 1200),
  power: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'square', 0.05, null, i * 0.08)),
  rad:   () => [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.1, 'square', 0.05, null, i * 0.06)),
  hurt:  () => tone(500, 0.3, 'sawtooth', 0.06, 120),
  die:   () => [494, 440, 392, 330, 262, 196].forEach((f, i) => tone(f, 0.16, 'square', 0.06, null, i * 0.13)),
  clear: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.16, 'square', 0.05, null, i * 0.12)),
  quack: () => { tone(620, 0.08, 'sawtooth', 0.05, 420); tone(580, 0.1, 'sawtooth', 0.045, 360, 0.1); },
  deny:  () => tone(160, 0.2, 'square', 0.05, 120),
  meow:  () => { tone(620, 0.12, 'triangle', 0.07, 950); tone(950, 0.3, 'triangle', 0.07, 480, 0.12); },
};
// =====================================================================
//  Música electrónica de la rave (sintetizada, 128 BPM)
// =====================================================================
const BPM = 128, STEP16 = 60 / BPM / 4;
const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];   // Lam · Fa · Do · Sol
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const MUSIC = { on: false, timer: null, next: 0, step: 0, start: 0, gain: null, noise: null };
function startMusic() {
  initAudio();
  if (!AC || MUSIC.on) return;
  MUSIC.on = true;
  MUSIC.gain = AC.createGain(); MUSIC.gain.gain.value = muted ? 0 : 0.45; MUSIC.gain.connect(AC.destination);
  if (!MUSIC.noise) {
    const b = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    MUSIC.noise = b;
  }
  MUSIC.step = 0; MUSIC.start = MUSIC.next = AC.currentTime + 0.05;
  MUSIC.timer = setInterval(scheduleMusic, 25);
}
function stopMusic() {
  if (!MUSIC.on) return;
  MUSIC.on = false; clearInterval(MUSIC.timer);
  const g = MUSIC.gain; g.gain.setTargetAtTime(0, AC.currentTime, 0.1);
  setTimeout(() => g.disconnect(), 800);
}
function scheduleMusic() {
  MUSIC.gain.gain.value = muted ? 0 : 0.45;
  while (MUSIC.next < AC.currentTime + 0.12) { playStep(MUSIC.step, MUSIC.next); MUSIC.next += STEP16; MUSIC.step++; }
}
function playStep(st, t) {
  const s = st % 16, bar = Math.floor(st / 16), chord = CHORDS[bar % 4];
  const env = (node, vol, dur) => {
    const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(MUSIC.gain);
  };
  const noise = (type, freq, vol, dur) => {
    const n = AC.createBufferSource(); n.buffer = MUSIC.noise;
    const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    n.connect(f); env(f, vol, dur); n.start(t); n.stop(t + dur);
  };
  if (s % 4 === 0) {                                   // bombo
    const o = AC.createOscillator(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.25);
    env(o, 0.9, 0.3); o.start(t); o.stop(t + 0.3);
  }
  if (s % 4 === 2) noise('highpass', 7000, 0.22, 0.09);  // hi-hat abierto
  else if (s % 2 === 1) noise('highpass', 9000, 0.07, 0.03);
  if (s === 4 || s === 12) noise('bandpass', 1500, 0.35, 0.16);   // palmada
  if (bar < 2) return;                                 // intro: solo ritmo
  if (s % 4 === 2 || s === 15) {                       // bajo
    const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(chord[0] - 24);
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(150, t + 0.18);
    o.connect(f); env(f, 0.3, 0.2); o.start(t); o.stop(t + 0.2);
  }
  if (bar >= 4) {                                      // arpegio
    const o = AC.createOscillator(); o.type = 'square';
    o.frequency.value = mtof(chord[s % 3] + 12 + (s % 8 >= 4 ? 12 : 0));
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1200 + 900 * Math.sin(bar * 0.8 + s * 0.2);
    o.connect(f); env(f, 0.07, 0.11); o.start(t); o.stop(t + 0.12);
  }
}
function raveBeat() { return MUSIC.on && AC ? Math.max(0, (AC.currentTime - MUSIC.start) * BPM / 60) : G.t * BPM / 3600; }

// =====================================================================
//  Entrada (teclado + táctil)
// =====================================================================
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyZ: 'jump',
  KeyX: 'fire', KeyJ: 'fire', KeyK: 'fire', ShiftLeft: 'fire', ShiftRight: 'fire',
  Enter: 'start', KeyP: 'pause', Escape: 'pause', KeyM: 'mute',
};
const held = {}, pressedQ = {};
const down = a => !!held[a];
const pressed = a => !!pressedQ[a];
addEventListener('keydown', e => {
  const a = KEYMAP[e.code]; initAudio();
  if (!a) return;
  e.preventDefault();
  if (!e.repeat) pressedQ[a] = true;
  held[a] = true;
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) held[a] = false; });
const IS_TOUCH = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (IS_TOUCH) {
  document.body.classList.add('touch');
  document.getElementById('touch').style.display = 'block';
  const TOUCH_KEYS = ['left', 'right', 'jump', 'fire', 'pause'];
  const btns = {}; document.querySelectorAll('.tbtn').forEach(b => { btns[b.dataset.k] = b; });
  // Revisa todos los dedos en pantalla: así se puede deslizar de ◀ a ▶ sin levantar el dedo
  const sync = e => {
    e.preventDefault(); initAudio();
    const now = {};
    let onCanvas = false;
    for (const t of e.touches) {
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const k = el && el.dataset ? el.dataset.k : null;
      if (k) now[k] = true; else onCanvas = true;
    }
    for (const k of TOUCH_KEYS) {
      if (now[k] && !held[k]) pressedQ[k] = true;
      held[k] = !!now[k];
      btns[k].classList.toggle('on', !!now[k]);
    }
    if (e.type === 'touchstart' && onCanvas) pressedQ.start = true;   // tocar la pantalla = ENTER
  };
  for (const ev of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) document.addEventListener(ev, sync, { passive: false });
}

// =====================================================================
//  Generador de mundos (dificultad creciente)
// =====================================================================
function generateLevel(wi, seed) {
  const rnd = mulberry32(seed);
  const R = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const chance = p => rnd() < p;
  const d = wi;
  const cols = 225 + d * 5;               // ~45 s por mundo
  const grid = []; for (let r = 0; r < ROWS; r++) grid.push(new Uint8Array(cols));
  const enemies = [], coins = [], plats = [], spots = [], cannons = [];
  const maxGap = Math.min(4, 2 + Math.floor(d / 2.5));
  const enemyP = Math.min(0.92, 0.5 + d * 0.07);
  const pool = ['raton', 'raton'];
  if (d >= 1) pool.push('erizo');
  if (d >= 2) pool.push('rana');
  if (d >= 3) pool.push('abeja');
  if (d >= 5) pool.push('erizo', 'rana', 'abeja');
  if (d >= 6) pool.push('abeja', 'rana');

  let x = 0, gh = 13;
  const setT = (c, r, t) => { if (c >= 0 && c < cols && r >= 0 && r < ROWS) grid[r][c] = t; };
  const ground = (c, top) => { for (let r = top; r < ROWS; r++) setT(c, r, r === top ? 1 : 2); };
  const enemy = (c, surf) => {
    const type = pool[R(0, pool.length - 1)];
    enemies.push({ type, c, r: type === 'abeja' ? surf - R(3, 4) : surf - 1 });
  };
  const coinRow = (c, r, n) => { for (let i = 0; i < n; i++) coins.push({ c: c + i, r }); };
  const flat = (n, en = true) => {
    for (let i = 0; i < n; i++) { ground(x + i, gh); spots.push({ c: x + i, r: gh - 1 }); }
    if (en && x > 16 && n >= 3 && chance(enemyP)) {
      const k = 1 + (chance(d * 0.07) ? 1 : 0) + (d >= 6 && chance(0.3) ? 1 : 0);
      for (let j = 0; j < k; j++) enemy(x + R(1, n - 1), gh);
    }
    x += n;
  };
  const clampH = h => clamp(h, 9, 14);
  const pipe = () => {
    const ph = R(2, 3);
    for (let k = 0; k < 2; k++) {
      ground(x + k, gh);
      for (let j = 1; j <= ph; j++) setT(x + k, gh - j, 5);
      spots.push({ c: x + k, r: gh - ph - 1 });
    }
    x += 2;
  };
  const bricks = (c0, n, r) => {
    for (let c = c0; c < c0 + n; c++) { setT(c, r, chance(0.25) ? 6 : 3); spots.push({ c, r: r - 1 }); }
  };

  // Peso de cada tipo de obstáculo según el mundo
  const WEIGHTS = {
    flat: 10, gap: 16, bridge: 10, stairs: 10, pipes: 9, floating: 10,
    spikes: d >= 1 ? 7 + d : 3,
    moving: d >= 2 ? 10 : 0,
    arena: d >= 2 ? 6 + d : 0,
    cannon: d >= 3 ? 5 + d : 0,
    islands: d >= 3 ? 5 + d : 0,
    vmoving: d >= 4 ? 7 : 0,
  };
  const total = Object.values(WEIGHTS).reduce((a, b) => a + b, 0);
  const pickSeg = () => {
    let r = rnd() * total;
    for (const k in WEIGHTS) { r -= WEIGHTS[k]; if (r < 0) return k; }
    return 'flat';
  };

  flat(12, false);
  while (x < cols - 40) {
    switch (pickSeg()) {
      case 'flat': {                      // terreno plano con cambio de altura
        gh = clampH(gh + R(-2, 2));
        const n = R(4, 8);
        if (chance(0.35)) coinRow(x + 1, gh - 3, Math.min(4, n - 2));
        flat(n);
        break;
      }
      case 'gap':                          // vacío
        x += R(2, maxGap);
        gh = clampH(gh + R(-1, 0));
        flat(R(3, 5), d >= 4);
        break;
      case 'bridge': {                     // puente de ladrillos sobre vacío
        const gw = R(4, 5 + Math.floor(d / 2)), br = gh - 3;
        bricks(x + 1, gw - 2, br);
        if (chance(0.6)) coinRow(x + 1, br - 2, gw - 2);
        if (d >= 3 && gw >= 5 && chance(0.4)) enemies.push({ type: 'raton', c: x + 2, r: br - 1 });
        x += gw; flat(R(3, 5), false);
        break;
      }
      case 'moving': {                     // plataforma móvil horizontal
        const gw = R(5, 7 + Math.floor(d / 3));
        plats.push({ x0: (x + 0.2) * T, x1: (x + gw - 3.2) * T, y0: gh * T, y1: gh * T, w: 3 * T, h: 14, speed: 0.8 + d * 0.12 });
        if (chance(0.5)) coinRow(x + 1, gh - 3, gw - 2);
        x += gw; flat(R(3, 5), false);
        break;
      }
      case 'vmoving': {                    // plataforma elevador hacia un terreno más alto
        const gw = R(3, 4), hi = Math.max(9, gh - R(2, 4));
        if (hi >= gh) { flat(4); break; }
        const px = (x + (gw - 2) / 2) * T;
        plats.push({ x0: px, x1: px, y0: gh * T, y1: hi * T - 6, w: 2 * T, h: 14, speed: 0.9 + d * 0.1 });
        x += gw; gh = hi; flat(R(3, 5), false);
        break;
      }
      case 'stairs': {                     // escaleras (con vacío en medio a partir del mundo 3)
        const h = Math.min(R(2, 2 + Math.floor(d / 2)), 4, gh - 5);
        for (let i = 0; i < h; i++) { ground(x, gh); for (let j = 1; j <= i + 1; j++) setT(x, gh - j, 4); spots.push({ c: x, r: gh - i - 2 }); x++; }
        ground(x, gh); for (let j = 1; j <= h; j++) setT(x, gh - j, 4); x++;
        if (d >= 2 && chance(0.55)) x += R(1, Math.min(3, maxGap));
        for (let i = h; i >= 1; i--) { ground(x, gh); for (let j = 1; j <= i; j++) setT(x, gh - j, 4); spots.push({ c: x, r: gh - i - 1 }); x++; }
        flat(R(3, 5));
        break;
      }
      case 'pipes':                        // tubos
        flat(2, false); pipe(); flat(R(3, 6));
        if (chance(0.5)) { pipe(); flat(3, false); }
        break;
      case 'floating': {                   // bloques flotantes (uno o dos pisos)
        const n = R(8, 11), s = x;
        flat(n);
        const br = gh - 3, bl = R(3, 5), bs = s + R(1, n - bl - 1);
        bricks(bs, bl, br);
        if (chance(0.5) && gh - 6 >= 3) {
          const hs = bs + R(1, bl - 2);
          bricks(hs, 2, gh - 6);
          coinRow(hs, gh - 8, 2);
        } else coinRow(bs, br - 1, bl);
        break;
      }
      case 'spikes': {                     // pinchos en el suelo
        flat(2, false);
        const k = R(1, Math.min(3, 1 + Math.floor(d / 2)));
        for (let i = 0; i < k; i++) { ground(x + i, gh); setT(x + i, gh - 1, 8); }
        if (chance(0.4)) coinRow(x, gh - 4, k);
        x += k; flat(R(2, 4), false);
        if (d >= 4 && chance(0.45)) {
          const k2 = R(1, 2);
          for (let i = 0; i < k2; i++) { ground(x + i, gh); setT(x + i, gh - 1, 8); }
          x += k2; flat(3, false);
        }
        break;
      }
      case 'cannon': {                     // cañón que dispara burbujas enojadas
        flat(2, false);
        const tall = d >= 5 && chance(0.5) ? 2 : 1;
        ground(x, gh); for (let j = 1; j <= tall; j++) setT(x, gh - j, 9);
        cannons.push({ c: x, r: gh - tall }); spots.push({ c: x, r: gh - tall - 1 });
        x++; flat(R(4, 7));
        break;
      }
      case 'arena': {                      // zona con varios animalitos
        const n = R(8, 12);
        for (let i = 0; i < n; i++) { ground(x + i, gh); spots.push({ c: x + i, r: gh - 1 }); }
        const k = 2 + (d >= 5 ? 1 : 0) + (chance(0.4) ? 1 : 0);
        for (let j = 0; j < k; j++) enemy(x + R(2, n - 1), gh);
        if (chance(0.6)) bricks(x + 3, R(2, 4), gh - 3);
        x += n;
        break;
      }
      case 'islands': {                    // islas pequeñas separadas por vacíos
        const k = R(3, 4);
        for (let i = 0; i < k; i++) {
          x += R(2, Math.max(2, maxGap - 1));
          gh = clampH(gh + R(-1, 1));
          const iw = R(2, 3);
          for (let j = 0; j < iw; j++) { ground(x + j, gh); spots.push({ c: x + j, r: gh - 1 }); }
          if (chance(0.4)) coinRow(x, gh - 3, iw);
          x += iw;
        }
        x += 2; flat(R(3, 5), false);
        break;
      }
    }
  }
  const endGh = gh;
  while (x < cols) { ground(x, gh); x++; }
  const flagC = cols - 16, tubC = cols - 9;

  // Botones: uno en la primera mitad, otro en la segunda, en posiciones aleatorias
  const valid = s => s.r >= 2 && grid[s.r][s.c] === 0 && s.c > 14 && s.c < flagC - 4;
  const sp = spots.filter(valid);
  const half = cols * 0.5;
  const a = sp.filter(s => s.c < half), b = sp.filter(s => s.c >= half);
  const pick = arr => arr[R(0, arr.length - 1)];
  const buttons = [pick(a.length ? a : sp), pick(b.length ? b : sp)];

  // Punto de control: suelo firme cerca de la mitad del mundo
  const cp = spots.find(s => s.c > cols * 0.45 && s.c < cols * 0.65 && grid[s.r][s.c] === 0 &&
    [-1, 0, 1].every(k => grid[s.r + 1][s.c + k] === 1 && grid[s.r][s.c + k] === 0)) || null;

  return {
    grid, cols, plats, buttons, endGh, cp,
    cannons: cannons.filter(c => grid[c.r][c.c] === 9),
    enemies: enemies.filter(e => e.r >= 1 && grid[e.r][e.c] === 0),
    coins: coins.filter(c => c.r >= 2 && grid[c.r][c.c] === 0),
    flagX: flagC * T, tubX: tubC * T, startY: 13 * T,
  };
}

// =====================================================================
//  Estado del juego
// =====================================================================
const G = {
  screen: 'title', world: 0, sel: 0, lives: VIDAS_INICIALES, score: 0, coins: 0,
  unlocked: clamp(parseInt(store('pato_unlocked')) || 1, 1, 8),
  seed: 0, timer: 0, t: 0, buttons: 0, msg: null, flagDrop: 0,
  cp: null, taken: [false, false], time: 0,
};
let L = null, TH = THEMES[0];
let enemies = [], coins = [], buttons = [], plats = [], cannons = [], fireballs = [], particles = [], popups = [], amb = [];
const bumps = new Map();
const cam = { x: 0 };
const player = {};
const skinOf = w => SKIN_POR_MUNDO[w % SKIN_POR_MUNDO.length];

const ENEMY_SIZE = { raton: [26, 20, 1.0], erizo: [28, 22, 0.7], rana: [26, 22, 0], abeja: [26, 22, 1.2] };

// respawn = true cuando el pato murió: mismo mapa, desde el punto de control si lo tocó
function loadWorld(respawn) {
  stopMusic();
  TH = THEMES[G.world];
  L = generateLevel(G.world, G.seed);
  const mult = 1 + G.world * 0.1;
  enemies = L.enemies.map(s => {
    const [w, h, spd] = ENEMY_SIZE[s.type];
    const y = (s.r + 1) * T - h;
    return {
      type: s.type, x: s.c * T + (T - w) / 2, y, w, h, vx: -spd * mult, vy: 0, baseY: y,
      ox: s.c * T, onGround: false, active: false, t: 0, jt: 60, face: -1, seed: Math.random() * 100,
    };
  });
  coins = L.coins.map(c => ({ x: c.c * T + 6, y: c.r * T + 6, w: 20, h: 20 }));
  // los botones ya recogidos en este mundo se conservan aunque el pato muera
  buttons = L.buttons.map((b, i) => ({ x: b.c * T + 4, y: b.r * T + 2, w: 24, h: 24, idx: i, taken: G.taken[i] }));
  plats = L.plats.map(p => ({ ...p, x: p.x0, y: p.y0, s: 0, dir: 1, dx: 0, dy: 0, wait: 0 }));
  cannons = L.cannons.map(c => ({ x: c.c * T, y: c.r * T, t: 60 + (c.c * 7) % 60 }));
  fireballs = []; particles = []; popups = []; amb = []; bumps.clear();
  G.buttons = G.taken.filter(Boolean).length; G.flagDrop = 0;
  Object.assign(player, {
    x: 3 * T + 5, w: 22, h: 24, vx: 0, vy: 0, onGround: false, facing: 1, state: 0, inv: 0,
    dead: false, fell: false, deadT: 0, jb: 0, coyote: 0, jumping: false, plat: null,
    speech: null, speechNext: null, growT: 0, hidden: false, anim: 0, prevBottom: 0,
  });
  player.y = L.startY - player.h;
  if (respawn && G.cp) {
    player.x = G.cp.x; player.y = G.cp.y - player.h;
    enemies = enemies.filter(e => Math.abs(e.x - G.cp.x) > 5 * T);
  }
  updateCamera(true);
  G.msg = respawn ? null : { text: '¡Encuentra los 2 botones!', t: 170 };
}

function newWorld() { G.seed = (Math.random() * 1e9) | 0; G.cp = null; G.taken = [false, false]; G.time = 0; }
function startGame(wi) {
  G.world = wi; G.lives = VIDAS_INICIALES; G.score = 0; G.coins = 0;
  newWorld(); goIntro(false);
}
function goIntro(respawn) { loadWorld(respawn); G.screen = 'intro'; G.timer = respawn ? 110 : 170; }
function nextWorld() {
  G.world++;
  if (G.world >= 8) { G.screen = 'win'; G.timer = 0; G.unlocked = 8; store('pato_unlocked', 8); return; }
  G.unlocked = Math.max(G.unlocked, G.world + 1); store('pato_unlocked', G.unlocked);
  newWorld(); goIntro(false);
}

// =====================================================================
//  Física de tiles
// =====================================================================
function solid(c, r) {
  if (c < 0 || c >= L.cols) return true;
  if (r < 0 || r >= ROWS) return false;
  const t = L.grid[r][c];
  return t !== 0 && t !== 8;   // los pinchos (8) no son sólidos: hacen daño
}
function moveBody(o) {
  const res = { hx: false, ceil: null, ground: false };
  o.x += o.vx;
  const r0 = Math.floor(o.y / T), r1 = Math.floor((o.y + o.h - 0.001) / T);
  if (o.vx > 0) {
    const c = Math.floor((o.x + o.w - 0.001) / T);
    for (let r = r0; r <= r1; r++) if (solid(c, r)) { o.x = c * T - o.w; res.hx = true; break; }
  } else if (o.vx < 0) {
    const c = Math.floor(o.x / T);
    for (let r = r0; r <= r1; r++) if (solid(c, r)) { o.x = (c + 1) * T; res.hx = true; break; }
  }
  o.y += o.vy; o.onGround = false;
  const c0 = Math.floor(o.x / T), c1 = Math.floor((o.x + o.w - 0.001) / T);
  if (o.vy > 0) {
    const r = Math.floor((o.y + o.h - 0.001) / T);
    for (let c = c0; c <= c1; c++) if (solid(c, r)) { o.y = r * T - o.h; o.vy = 0; o.onGround = true; res.ground = true; break; }
  } else if (o.vy < 0) {
    const r = Math.floor(o.y / T);
    const cc = Math.floor((o.x + o.w / 2) / T);
    const hit = solid(cc, r) ? cc : (solid(c0, r) ? c0 : (solid(c1, r) ? c1 : null));
    if (hit !== null) { o.y = (r + 1) * T; o.vy = 0; res.ceil = { c: hit, r }; }
  }
  return res;
}

// =====================================================================
//  Efectos
// =====================================================================
function burst(x, y, color, n = 10, spd = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 30 + Math.random() * 20, max: 50, c: color, r: 2 + Math.random() * 3, g: 0.15 });
  }
}
function popup(text, x, y, color = '#fff') { popups.push({ text, x, y, t: 50, color }); }
function addScore(n, x, y) { G.score += n; if (x !== undefined) popup(String(n), x, y); }
function addCoin() { G.coins++; G.score += 10; if (G.coins % 100 === 0) { G.lives++; popup('+1 VIDA', player.x, player.y - 30, '#7dff7d'); } }

// Muestra un letrero sobre el pato (sin voz). 'next' es una frase que aparece justo después.
function say(text, next = null) { player.speech = { text, t: 150 }; player.speechNext = next; }
function goalName(w) {
  const g = THEMES[w].goal;
  return g === 'duomo' ? 'la Catedral de Santa María del Fiore' : g === 'rave' ? 'la fiesta rave' : 'la bañera';
}
function randomPhrase() {
  const frases = skinOf(G.world) === 'italiano' ? FRASES_ITALIANO : FRASES_BOTON;
  return frases[Math.floor(Math.random() * frases.length)];
}

// =====================================================================
//  Jugador
// =====================================================================
function setState(s) {
  const p = player, bottom = p.y + p.h, cx = p.x + p.w / 2;
  p.state = s;
  [p.w, p.h] = s === 0 ? [22, 24] : [28, 34];
  p.x = cx - p.w / 2; p.y = bottom - p.h; p.growT = 30;
}
function hurt() {
  const p = player;
  if (p.inv > 0 || p.dead) return;
  if (p.state === 0) { die(false); return; }
  setState(p.state - 1);
  p.inv = 110; SFX.hurt();
  popup(p.state === 1 ? '¡Perdí el poder!' : '¡Me encogí!', p.x - 20, p.y - 20, '#ffb3b3');
}
function die(fell) {
  const p = player;
  if (p.dead) return;
  p.dead = true; p.fell = fell; p.deadT = 0; p.vx = 0; p.vy = fell ? 0 : -10;
  p.speechNext = null;
  p.speech = { text: FRASE_MUERTE, t: 999, ax: p.x + p.w / 2, ay: Math.min(p.y, H - 70) };
  SFX.die();
}
function afterDeath() {
  G.lives--;
  if (G.lives <= 0) { G.screen = 'gameover'; G.timer = 0; }
  else goIntro(true);   // mismo mundo, mismo mapa
}

function bumpBlock(c, r) {
  const t = L.grid[r][c];
  if (t === 6) {
    L.grid[r][c] = 7; bumps.set(c + ',' + r, 10);
    particles.push({ coin: true, x: c * T + 16, y: r * T - 8, vx: 0, vy: -7, life: 28, max: 28, g: 0.45 });
    addCoin(); addScore(100); SFX.coin();
  } else if (t === 3) {
    const nearButton = buttons.some(b => !b.taken && Math.abs(b.x / T - c) < 5);
    if (player.state > 0 && !nearButton) {
      L.grid[r][c] = 0; SFX.brk(); addScore(50);
      for (let i = 0; i < 4; i++) particles.push({ x: c * T + 8 + (i % 2) * 16, y: r * T + 8 + (i > 1 ? 16 : 0), vx: (i % 2 ? 2 : -2), vy: -6 + (i > 1 ? 2 : 0), life: 60, max: 60, c: TH.brick, r: 6, g: 0.4, sq: true });
    } else { bumps.set(c + ',' + r, 10); SFX.bump(); }
  } else SFX.bump();
  // animalitos encima del bloque golpeado salen volando
  for (const e of enemies) {
    if (!e.dying && !e.gone && Math.abs(e.y + e.h - r * T) < 4 && e.x + e.w > c * T && e.x < c * T + T) killEnemy(e, 'flip');
  }
}

function updatePlayer() {
  const p = player;
  if (p.dead) {
    p.deadT++;
    if (!p.fell && p.deadT > 25) { p.vy += 0.5; p.y += p.vy; }
    if (p.deadT > 160) afterDeath();
    return;
  }
  if (p.plat) { p.x += p.plat.dx; p.y = p.plat.y - p.h; }
  p.prevBottom = p.y + p.h;

  const left = down('left'), right = down('right');
  const ice = TH.ice && p.onGround;
  const acc = ice ? 0.12 : (p.onGround ? 0.42 : 0.3);
  if (left && !right) { p.vx -= acc; p.facing = -1; }
  else if (right && !left) { p.vx += acc; p.facing = 1; }
  else {
    const fr = p.onGround ? (TH.ice ? 0.03 : 0.38) : 0.08;
    if (Math.abs(p.vx) <= fr) p.vx = 0; else p.vx -= Math.sign(p.vx) * fr;
  }
  p.vx = clamp(p.vx, -MAXV, MAXV);

  // salto con buffer y "coyote time"
  if (pressed('jump')) p.jb = 8; else if (p.jb > 0) p.jb--;
  if (p.onGround) p.coyote = 7; else if (p.coyote > 0) p.coyote--;
  if (p.jb > 0 && p.coyote > 0) {
    p.vy = JUMP - Math.abs(p.vx) * 0.12; p.jb = 0; p.coyote = 0; p.plat = null; p.jumping = true; SFX.jump();
  }
  if (p.jumping && !down('jump') && p.vy < -3.5) p.vy = -3.5;
  if (p.vy >= 0) p.jumping = false;
  p.vy = Math.min(p.vy + GRAV, MAXFALL);

  const res = moveBody(p);
  if (res.ceil) bumpBlock(res.ceil.c, res.ceil.r);

  p.plat = null;
  for (const pl of plats) {
    if (p.vy >= 0 && p.prevBottom <= pl.y + 6 && p.y + p.h >= pl.y && p.x + p.w > pl.x + 2 && p.x < pl.x + pl.w - 2) {
      p.y = pl.y - p.h; p.vy = 0; p.onGround = true; p.plat = pl;
    }
  }

  // fuego radiactivo
  if (p.state === 2 && pressed('fire') && fireballs.length < 3) {
    fireballs.push({ x: p.facing > 0 ? p.x + p.w : p.x - 12, y: p.y + p.h * 0.3, w: 12, h: 12, vx: p.facing * 7.5, vy: 1.5, life: 160 });
    SFX.fire();
  }
  if (p.state === 2 && G.t % 4 === 0) {
    particles.push({ x: p.x + Math.random() * p.w, y: p.y + p.h * Math.random(), vx: 0, vy: -0.8, life: 25, max: 25, c: '#9dff5a', r: 2, g: -0.01 });
  }

  // pinchos
  if (p.inv === 0) {
    const r = Math.floor((p.y + p.h - 1) / T);
    for (let c = Math.floor((p.x + 4) / T); c <= Math.floor((p.x + p.w - 4) / T); c++) {
      if (r >= 0 && r < ROWS && L.grid[r][c] === 8 && p.y + p.h > r * T + 14) {
        hurt(); if (!p.dead) { p.vy = -9; p.jumping = false; } break;
      }
    }
  }

  if (p.inv > 0) p.inv--;
  if (p.growT > 0) p.growT--;
  if (p.speech && --p.speech.t <= 0) { p.speech = p.speechNext ? { text: p.speechNext, t: 150 } : null; p.speechNext = null; }
  p.anim += Math.abs(p.vx) * 0.12;
  if (p.y > H + 30) die(true);
}

// =====================================================================
//  Animalitos
// =====================================================================
function killEnemy(e, kind) {
  e.dying = kind;
  if (kind === 'squash') { e.dt = 30; addScore(100, e.x, e.y - 10); SFX.stomp(); }
  else { e.vy = -6; e.vx = (Math.random() < 0.5 ? -1 : 1) * 1.5; addScore(200, e.x, e.y - 10); SFX.kill(); }
  burst(e.x + e.w / 2, e.y + e.h / 2, '#fff', 6, 2);
}
function updateEnemies() {
  const p = player, mult = 1 + G.world * 0.1;
  for (const e of enemies) {
    if (e.gone) continue;
    if (!e.active) { if (e.x < cam.x + W + 80) e.active = true; else continue; }
    if (e.dying === 'squash') { if (--e.dt <= 0) e.gone = true; continue; }
    if (e.dying === 'flip') { e.vy += 0.45; e.x += e.vx; e.y += e.vy; if (e.y > H + 60) e.gone = true; continue; }
    e.t++;
    if (e.type === 'bala') {
      e.x += e.vx;
      if (e.x < cam.x - 200 || e.x > cam.x + W + 200) { e.gone = true; continue; }
    } else if (e.type === 'abeja') {
      e.x += e.vx;
      if (Math.abs(e.x - e.ox) > 3 * T) { e.x = e.ox + Math.sign(e.x - e.ox) * 3 * T; e.vx = -e.vx; }
      e.y = e.baseY + Math.sin(e.t * 0.05) * 26;
    } else if (e.type === 'rana') {
      e.vy = Math.min(e.vy + GRAV, MAXFALL);
      if (e.onGround) {
        e.vx = 0; e.face = p.x < e.x ? -1 : 1;
        if (--e.jt <= 0 && Math.abs(p.x - e.x) < W * 0.7) {
          e.vy = -9 - G.world * 0.25; e.vx = e.face * 1.6 * mult; e.jt = 70 + Math.floor(Math.random() * 60);
        }
      }
      const r = moveBody(e); if (r.hx) e.vx = 0;
    } else {
      e.vy = Math.min(e.vy + GRAV, MAXFALL);
      const v = e.vx, r = moveBody(e);
      if (r.hx) e.vx = -v;
      else if (e.onGround) {
        const fx = v > 0 ? e.x + e.w + 2 : e.x - 2;
        if (!solid(Math.floor(fx / T), Math.floor((e.y + e.h + 4) / T))) e.vx = -v;
      }
    }
    if (e.y > H + 40) { e.gone = true; continue; }

    if (!p.dead && overlap(p, e, 3)) {
      const stompable = e.type !== 'erizo';   // al erizo no se le puede pisar
      if (stompable && p.vy > 0 && p.prevBottom <= e.y + 10) {
        killEnemy(e, 'squash');
        p.y = e.y - p.h;
        p.vy = down('jump') ? -11 : -7; p.jumping = down('jump');
      } else hurt();
    }
  }
  enemies = enemies.filter(e => !e.gone);
}

function updateFireballs() {
  for (const f of fireballs) {
    f.vy = Math.min(f.vy + 0.45, 9);
    const r = moveBody(f);
    if (r.ground) f.vy = -5.5;
    if (G.t % 2 === 0) particles.push({ x: f.x + 6, y: f.y + 6, vx: 0, vy: 0, life: 14, max: 14, c: '#7dff3a', r: 4, g: 0 });
    if (r.hx || r.ceil || --f.life <= 0 || f.y > H || f.x < cam.x - 50 || f.x > cam.x + W + 50) f.dead = true;
    for (const e of enemies) {
      if (!f.dead && !e.dying && e.active && overlap(f, e)) { killEnemy(e, 'flip'); f.dead = true; }
    }
    if (f.dead) burst(f.x + 6, f.y + 6, '#b6ff6a', 8, 2.5);
  }
  fireballs = fireballs.filter(f => !f.dead);
}

// =====================================================================
//  Actualización general
// =====================================================================
function updateParticles() {
  for (const q of particles) { q.vy += q.g; q.x += q.vx; q.y += q.vy; q.life--; }
  particles = particles.filter(q => q.life > 0);
  for (const q of popups) { q.y -= 0.8; q.t--; }
  popups = popups.filter(q => q.t > 0);
  for (const [k, v] of bumps) { if (v <= 1) bumps.delete(k); else bumps.set(k, v - 1); }
  // partículas ambientales (pantalla)
  const a = TH.amb;
  if (a === 'snow' && G.t % 3 === 0) amb.push({ x: Math.random() * W, y: -5, vx: -0.3 + Math.random() * 0.6, vy: 0.7 + Math.random(), r: 1.5 + Math.random() * 2, c: '#fff' });
  if (a === 'ember' && G.t % 4 === 0) amb.push({ x: Math.random() * W, y: H + 5, vx: -0.3 + Math.random() * 0.6, vy: -0.8 - Math.random(), r: 1.5 + Math.random() * 2, c: '#ff9a3a' });
  if (a === 'toxic' && G.t % 6 === 0) amb.push({ x: Math.random() * W, y: H + 5, vx: 0, vy: -0.5 - Math.random() * 0.6, r: 2 + Math.random() * 4, c: 'rgba(140,255,80,.45)' });
  if (a === 'drip' && G.t % 20 === 0) amb.push({ x: Math.random() * W, y: 52, vx: 0, vy: 3, r: 1.8, c: 'rgba(120,200,255,.8)' });
  for (const q of amb) { q.x += q.vx + Math.sin((G.t + q.y) * 0.02) * 0.2; q.y += q.vy; }
  amb = amb.filter(q => q.y > -10 && q.y < H + 10);
}

function updateCamera(instant) {
  const p = player;
  const target = clamp(p.x + p.w / 2 - W * 0.4, 0, L.cols * T - W);
  cam.x = instant ? target : cam.x + (target - cam.x) * 0.12;
}

function updateWorld() {
  const p = player;
  if (p.dead) { updatePlayer(); updateParticles(); return; }
  G.time++;
  for (const pl of plats) {
    pl.dx = pl.dy = 0;
    if (pl.wait > 0) { pl.wait--; continue; }
    const ox = pl.x, oy = pl.y;
    pl.s += pl.dir * pl.speed / (Math.hypot(pl.x1 - pl.x0, pl.y1 - pl.y0) || 1);
    if (pl.s >= 1) { pl.s = 1; pl.dir = -1; pl.wait = 30; }
    if (pl.s <= 0) { pl.s = 0; pl.dir = 1; pl.wait = 30; }
    pl.x = pl.x0 + (pl.x1 - pl.x0) * pl.s; pl.y = pl.y0 + (pl.y1 - pl.y0) * pl.s;
    pl.dx = pl.x - ox; pl.dy = pl.y - oy;
  }
  // cañones de burbujas: disparan hacia el pato cuando está en pantalla
  for (const cn of cannons) {
    if (cn.x < cam.x - T || cn.x > cam.x + W) continue;
    const dx = p.x + p.w / 2 - (cn.x + T / 2);
    if (Math.abs(dx) < 2.5 * T || --cn.t > 0) continue;
    cn.t = Math.max(80, 170 - G.world * 12);
    const dir = Math.sign(dx);
    enemies.push({ type: 'bala', x: cn.x + (dir > 0 ? T : -24), y: cn.y + 6, w: 24, h: 20, vx: dir * (2.2 + G.world * 0.15), vy: 0, active: true, t: 0, seed: Math.random() * 100 });
    tone(300, 0.1, 'triangle', 0.08, 520);
  }
  // punto de control
  if (L.cp && !G.cp && p.x + p.w / 2 > L.cp.c * T + T / 2) {
    G.cp = { x: L.cp.c * T + 5, y: (L.cp.r + 1) * T };
    SFX.power(); popup('¡PUNTO DE CONTROL!', L.cp.c * T - 60, L.cp.r * T - 40, '#7dff7d');
  }
  updatePlayer();
  updateEnemies();
  updateFireballs();

  for (const c of coins) {
    if (!c.taken && overlap(p, c)) { c.taken = true; addCoin(); SFX.coin(); burst(c.x + 10, c.y + 10, '#ffe066', 5, 2); }
  }
  coins = coins.filter(c => !c.taken);

  for (const b of buttons) {
    if (b.taken || p.dead || !overlap(p, b)) continue;
    b.taken = true; G.taken[b.idx] = true; G.buttons++;
    burst(b.x + 12, b.y + 12, b.idx ? '#64b5f6' : '#ff6f6f', 22, 4);
    addScore(1000, b.x, b.y - 10);
    if (G.buttons === 1) {
      setState(Math.max(p.state, 1)); SFX.power();
      say(randomPhrase());
    } else {
      setState(2); SFX.rad();
      say(FRASE_DOS_BOTONES, randomPhrase());
      G.msg = { text: `☢ ¡PATO RADIACTIVO!  Dispara con ${IS_TOUCH ? '🔥' : 'X'}`, t: 180 };
    }
  }

  // meta: la bañera (solo con los 2 botones)
  if (!p.dead && p.x + p.w >= L.flagX + T / 2 - 4) {
    if (G.buttons >= 2) {
      G.screen = 'clear'; G.timer = 0; addScore(2000); G.raveArrive = null;
      if (TH.goal === 'rave') startMusic(); else SFX.clear();
      p.speech = null; G.msg = null;
    } else {
      p.x = L.flagX + T / 2 - 4 - p.w; if (p.vx > 0) p.vx = 0;
      const n = 2 - G.buttons;
      if (!G.msg || G.msg.t < 60) { G.msg = { text: `¡Te falta${n > 1 ? 'n' : ''} ${n} botón${n > 1 ? 'es' : ''}!`, t: 120 }; SFX.deny(); }
    }
  }
  if (G.msg && --G.msg.t <= 0) G.msg = null;
  updateParticles();
  updateCamera(false);
}

// ---------- Llegada a la rave: la pata le da un beso y todos celebran ----------
const RAVE_DANCERS = ['medico', 'italiano', 'vaquero', 'batman', 'playero', 'esquimal', 'bombero'];
function ravePos() {

    dancers: [L.flagX + 1.6 * T, L.flagX + 3 * T, b + 1.1 * T, b + 2.5 * T, b + 5.3 * T, b + 6.6 * T, b + 7.8 * T],

function updateRaveClear() {

    if (k > 90 && p.onGround && k % 28 === 0) p.vy = -8;        // el pato también brinca
    if (k > 70 && G.timer % 3 === 0) particles.push({ x: cam.x + Math.random() * W, y: 52, vx: (Math.random() - 0.5) * 1.5, vy: 1 + Math.random(), life: 160, max: 160, c: `hsl(${Math.random() * 360},100%,60%)`, r: 3, g: 0.02, sq: true });

function updateClear() {
  const p = player;

  if (!p.hidden) {

      else burst(L.tubX + T * 1.5, L.endGh * T - 40, '#e0f4ff', 25, 4);
    }
  } else if (TH.goal === 'duomo') {
    if (G.timer % 6 === 0) particles.push({ x: L.tubX + Math.random() * T * 5 - T, y: L.endGh * T - 330, vx: (Math.random() - 0.5) * 1.5, vy: 1, life: 90, max: 90, c: ['#ffffff', '#3f8f5a', '#e57373', '#ffd84d'][Math.floor(Math.random() * 4)], r: 3, g: 0.03, sq: true });

  }
  // los gaticos celebran con corazones cuando el pato llega a la bañera

    const cx = catSpots()[Math.floor(G.timer / 12) % 2];
    particles.push({ heart: true, x: cx + (Math.random() - 0.5) * 20, y: L.endGh * T - 50, vx: (Math.random() - 0.5) * 1.2, vy: -1.4, life: 70, max: 70, g: 0 });
  }
  updateParticles();
  updateCamera(false);
  if (G.timer > 260) nextWorld();

function update() {
  G.t++;
  if (pressed('mute')) muted = !muted;
  const go = pressed('start') || pressed('jump');
  switch (G.screen) {
    case 'title':
      TH = THEMES[G.sel];
      if (pressed('left')) G.sel = (G.sel + G.unlocked - 1) % G.unlocked;
      if (pressed('right')) G.sel = (G.sel + 1) % G.unlocked;
      updateParticles();
      if (go) startGame(G.sel);
      break;
    case 'intro':
      if (--G.timer <= 0) { G.screen = 'play'; updateCamera(true); }
      break;
    case 'play':
      if (pressed('pause')) { G.screen = 'pause'; break; }
      updateWorld();
      break;
    case 'pause':
      if (pressed('pause') || pressed('start')) G.screen = 'play';
      break;
    case 'clear':
      updateClear();
      break;
    case 'gameover':
    case 'win':
      G.timer++;
      if (G.screen === 'win') updateParticles();
      if (G.timer > 60 && go) { G.sel = Math.min(G.world, G.unlocked - 1); G.screen = 'title'; stopMusic(); }
      break;
  }
  for (const k in pressedQ) delete pressedQ[k];
}

        const sx = x + k * 16;
        ctx.fillStyle = '#cfd8dc'; ctx.beginPath(); ctx.moveTo(sx + 1, y + T); ctx.lineTo(sx + 8, y + 11); ctx.lineTo(sx + 15, y + T); ctx.fill();
        ctx.fillStyle = '#78909c'; ctx.beginPath(); ctx.moveTo(sx + 8, y + 11); ctx.lineTo(sx + 15, y + T); ctx.lineTo(sx + 8, y + T); ctx.fill();
      }
      break;
    case 9:
      bevel(x, y, '#37474f');
      ctx.fillStyle = '#ffca28'; ctx.fillRect(x + 13, y, 6, T);
      ctx.fillStyle = '#111'; circ(x + 3, y + 16, 6); circ(x + T - 3, y + 16, 6);
      ctx.fillStyle = 'rgba(170,220,255,.6)'; circ(x + 3, y + 16, 3); circ(x + T - 3, y + 16, 3);

  }
}

function drawDuck(cx, by, sc, facing, o = {}) {
  ctx.save();
  if (o.dead) { ctx.translate(cx, by - 12 * sc); ctx.scale(sc * facing, -sc); ctx.translate(0, 12); }
  else { ctx.translate(cx, by); ctx.scale(sc * facing * (o.sx || 1), sc * (o.sy || 1)); }
  const body = o.rad ? '#8cff3a' : '#ffd21f';
  const dark = o.rad ? '#3fb818' : '#f0a800';
  skinBack(o.skin);
  if (o.rad) { ctx.shadowColor = '#7dff3a'; ctx.shadowBlur = 18; }
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.moveTo(-9, -10); ctx.lineTo(-16, -20); ctx.lineTo(-5, -15); ctx.fill();
  ell(0, -8, 13, 8.5);
  circ(5, -18, 7);
  ctx.shadowBlur = 0;
  // ala
  ctx.fillStyle = dark;
  ell(-2, -9 + (o.flap ? Math.sin(G.t * 0.6) * 2 : 0), 7, 4.2, o.flap ? -0.4 : 0.1);
  // pico
  ctx.fillStyle = '#ff7a1a'; ell(12, -17, 5, 2.6);
  ctx.strokeStyle = '#c24d00'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(8, -17); ctx.lineTo(16.5, -17); ctx.stroke();
  skinMid(o.skin, o.rad);
  // ojo
  ctx.fillStyle = '#fff'; circ(7, -20.5, 2.5);
  ctx.fillStyle = '#111'; circ(7.7, -20.5, 1.6);
  ctx.fillStyle = '#fff'; circ(8.2, -21.2, 0.6);
  // mejilla
  ctx.fillStyle = 'rgba(255,120,150,.55)'; circ(8, -15, 1.8);
  // símbolo radiactivo
  if (o.rad) {
    ctx.fillStyle = '#ffe600'; circ(0, -6, 4.6);
    ctx.fillStyle = '#111';
    for (let k = 0; k < 3; k++) {
      const a = -Math.PI / 2 + k * Math.PI * 2 / 3;
      ctx.beginPath(); ctx.moveTo(0, -6); ctx.arc(0, -6, 4, a - 0.5, a + 0.5); ctx.fill();
    }
    ctx.fillStyle = '#ffe600'; circ(0, -6, 1.3); ctx.fillStyle = '#111'; circ(0, -6, 0.9);
  }
  skinTop(o.skin);
  ctx.restore();
}

// ---------- Skins (coordenadas locales del pato: cabeza en (5,-18) r7, cuerpo en (0,-8)) ----------
function skinBack(s) {
  if (s === 'batman') {            // capa
    const w = Math.sin(G.t * 0.2) * 2;
    ctx.fillStyle = '#1b1b2a';
    ctx.beginPath(); ctx.moveTo(5, -14); ctx.quadraticCurveTo(-10, -18, -22, -3 + w);
    ctx.lineTo(-15, -1); ctx.lineTo(-10, -4); ctx.lineTo(-4, 0); ctx.lineTo(3, -6); ctx.closePath(); ctx.fill();
  }
  if (s === 'esquimal') {          // punta de la bufanda al viento

    ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(-9, -15 + Math.sin(G.t * 0.25) * 2); ctx.lineTo(-8, -11); ctx.lineTo(0, -10); ctx.fill();

}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x + e.w / 2, e.y + e.h);
  const dir = e.type === 'rana' ? 1 : (e.vx >= 0 ? 1 : -1);
  if (e.dying === 'flip') { ctx.translate(0, -e.h / 2); ctx.scale(dir, -1); ctx.translate(0, e.h / 2); }
  else ctx.scale(dir, 1);
  if (e.dying === 'squash') ctx.scale(1.25, 0.35);
  const t = G.t + e.seed;
  switch (e.type) {
    case 'raton': {
      ctx.strokeStyle = '#f4a7b9'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-11, -8); ctx.quadraticCurveTo(-22, -4 + Math.sin(t * 0.2) * 4, -24, -14); ctx.stroke();
      const s = Math.sin(t * 0.3) * 3;
      ctx.fillStyle = '#6d6d78'; ell(-5 + s, -1.5, 3.5, 2); ell(5 - s, -1.5, 3.5, 2);
      ctx.fillStyle = '#8e8e9a'; ell(-1, -9, 12, 8.5);
      ctx.fillStyle = '#a5a5b2'; circ(9, -11, 6.5);
      ctx.fillStyle = '#8e8e9a'; circ(6, -17, 4.5); ctx.fillStyle = '#f4a7b9'; circ(6, -17, 2.8);
      ctx.fillStyle = '#ff6f91'; circ(15.5, -11, 1.8);
      ctx.fillStyle = '#111'; circ(11, -13, 1.5);
      break;
    }
    case 'erizo': {
      ctx.fillStyle = '#4a2f1a';
      for (let k = 0; k < 8; k++) {
        const a = Math.PI * (1.0 + k * 0.125);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a - 0.14) * 12, -9 + Math.sin(a - 0.14) * 9);
        ctx.lineTo(Math.cos(a) * 21, -9 + Math.sin(a) * 18);
        ctx.lineTo(Math.cos(a + 0.14) * 12, -9 + Math.sin(a + 0.14) * 9);
        ctx.fill();
      }
      const s = Math.sin(t * 0.3) * 2;
      ctx.fillStyle = '#3a2412'; ell(-5 + s, -1.5, 3.5, 2); ell(5 - s, -1.5, 3.5, 2);
      ctx.fillStyle = '#7a5132'; ell(0, -9, 13, 9);
      ctx.fillStyle = '#e8c49a'; ell(9, -8, 6, 5.5);
      ctx.fillStyle = '#111'; circ(15, -8, 2); circ(10, -11, 1.4);
      break;
    }
    case 'rana': {
      const air = !e.onGround;
      ctx.fillStyle = '#2f8a2c';
      if (air) { ell(-6, -1, 3, 7); ell(6, -1, 3, 7); } else { ell(-10, -3, 5.5, 3); ell(10, -3, 5.5, 3); }
      ctx.fillStyle = '#3fae3a'; ell(0, -9, air ? 10 : 13, air ? 11 : 8);
      ctx.fillStyle = '#b8e986'; ell(0, -6, 7, 4);
      ctx.fillStyle = '#3fae3a'; circ(-5, -16, 5); circ(5, -16, 5);
      ctx.fillStyle = '#fff'; circ(-5, -16, 3.4); circ(5, -16, 3.4);
      ctx.fillStyle = '#111'; circ(-5 + e.face, -16, 1.8); circ(5 + e.face, -16, 1.8);
      ctx.strokeStyle = '#1d5c1b'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(0, -11, 5, 0.3, Math.PI - 0.3); ctx.stroke();
      break;
    }
    case 'bala': {                   // burbuja enojada
      ctx.fillStyle = 'rgba(170,220,255,.45)'; circ(0, -10, 11);
      ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(0, -10, 11, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ell(-4, -15, 3, 1.8, -0.6);
      ctx.fillStyle = '#123'; circ(3, -10, 1.8); circ(8, -10, 1.8);
      ctx.strokeStyle = '#123'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(1, -14.5); ctx.lineTo(4.5, -12.5); ctx.moveTo(10, -14.5); ctx.lineTo(6.5, -12.5); ctx.stroke();
      break;
    }
    case 'abeja': {
      const f = Math.sin(t * 0.9) * 0.5;
      ctx.fillStyle = 'rgba(255,255,255,.75)'; ell(-4, -21, 5, 9, -0.5 + f); ell(3, -21, 5, 9, 0.5 - f);
      ctx.fillStyle = '#222'; ctx.beginPath(); ctx.moveTo(-11, -12); ctx.lineTo(-17, -10); ctx.lineTo(-11, -8); ctx.fill();
      ctx.fillStyle = '#ffcc00'; ell(0, -11, 12, 8);
      ctx.save(); ctx.beginPath(); ctx.ellipse(0, -11, 12, 8, 0, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = '#222'; ctx.fillRect(-7, -20, 4, 20); ctx.fillRect(0, -20, 4, 20); ctx.restore();
      ctx.fillStyle = '#111'; circ(8, -13, 1.8);
      break;
    }
  }
  ctx.restore();
}

  ctx.fillStyle = c[1];
  for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) circ(cx + dx * r * 0.22, cy + dy * r * 0.22, r * 0.12);

}

function drawFlagAndTub() {
  if (L.cp) {
    const cx = L.cp.c * T + T / 2, cy = (L.cp.r + 1) * T;
    ctx.fillStyle = '#ddd'; ctx.fillRect(cx - 2, cy - 2.6 * T, 4, 2.6 * T);
    ctx.fillStyle = G.cp ? '#43c46b' : '#9e9e9e';
    const wv = Math.sin(G.t * 0.15) * 2;
    ctx.beginPath(); ctx.moveTo(cx + 2, cy - 2.6 * T); ctx.lineTo(cx + 34, cy - 2.6 * T + 11 + wv); ctx.lineTo(cx + 2, cy - 2.6 * T + 22); ctx.fill();
    ctx.fillStyle = '#fff'; circ(cx + 13, cy - 2.6 * T + 11, 4);
  }
  const gy = L.endGh * T;
  const px = L.flagX + T / 2 - 3;
  ctx.fillStyle = '#ddd'; ctx.fillRect(px, gy - 8.5 * T, 6, 8.5 * T);
  ctx.fillStyle = '#ffd21f'; circ(px + 3, gy - 8.5 * T - 4, 7);
  const fy = gy - 8.2 * T + G.flagDrop * 6.5 * T;
  const wave = Math.sin(G.t * 0.15) * 3;
  ctx.fillStyle = G.buttons >= 2 ? '#43c46b' : '#e24b4b';
  ctx.beginPath(); ctx.moveTo(px, fy); ctx.lineTo(px - 58, fy + 20 + wave); ctx.lineTo(px, fy + 40); ctx.fill();
  drawDuck(px - 22, fy + 28, 0.55, -1, { rad: G.buttons >= 2, skin: skinOf(G.world) });
  ctx.fillStyle = '#9a9a9a'; ctx.fillRect(px - 6, gy - 10, 18, 10);
  if (TH.goal === 'duomo') { drawDuomo(L.tubX + T * 1.4, gy); return; }
  if (TH.goal === 'rave') { drawRave(gy); return; }
  // bañera
  const tx = L.tubX, tw = 3 * T;
  ctx.fillStyle = '#b0b8c4'; ctx.fillRect(tx + tw - 8, gy - 100, 8, 40); ctx.fillRect(tx + tw - 26, gy - 100, 24, 8);
  ctx.fillStyle = '#c9a227'; circ(tx + 10, gy - 4, 6); circ(tx + tw - 10, gy - 4, 6);
  ctx.fillStyle = '#9fd8ff'; rrect(tx + 4, gy - 52, tw - 8, 14, 7); ctx.fill();
  ctx.fillStyle = '#fff'; rrect(tx, gy - 44, tw, 38, 16); ctx.fill();
  ctx.fillStyle = '#e6eef7'; ctx.fillRect(tx + 6, gy - 44, tw - 12, 5);
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  for (let k = 0; k < 6; k++) circ(tx + 10 + k * 15, gy - 50 + Math.sin(G.t * 0.08 + k) * 2, 7 + (k % 2) * 3);
  txt('META', tx + tw / 2, gy - 18, 13, '#4a90c2', 'center', null);
  if (hasCats()) drawCats(gy);
}

// ---------- Dos gaticos esperando al pato junto a la bañera ----------
function hasCats() { return MUNDOS_CON_GATICOS.includes(G.world); }
function catSpots() { return [L.tubX + 4.3 * T, L.tubX + 5.7 * T]; }
const GATICOS = [
  // atigrado gris-café con cara, pecho y patitas blancas, ojos verdes
  { col: '#75685e', dark: '#4b413a', belly: '#fff', blaze: '#fff', paws: '#fff', eye: '#a9d86e', stripes: true },
  // gris claro atigrado, hocico clarito, ojos azul pálido
  { col: '#c8beb3', dark: '#958a80', belly: '#e9e3dc', muzzle: '#eee8e1', paws: '#e9e3dc', eye: '#a9cbe0', stripes: true },
];
function drawCats(gy) {
  const p = player, home = G.screen === 'clear' && p.hidden;
  const near = G.screen === 'play' && !p.dead && p.x > L.flagX - 8 * T;
  const xs = catSpots();
  xs.forEach((x, i) => {
    const hop = home ? Math.abs(Math.sin(G.t * 0.13 + i * 1.6)) * 22
      : near ? Math.abs(Math.sin(G.t * 0.1 + i * 1.6)) * 6 : 0;
    drawCat(x, gy - hop, 1.25, -1, { ...GATICOS[i], phase: i * 2.3, happy: home || near });
  });
  if (near && Math.floor(G.t / 70) % 2 === 0) {
    const i = Math.floor(G.t / 140) % 2;
    drawBubble('¡Miau!', xs[i], gy - 52, 1);
  }
  if (home && G.timer < 230) drawBubble('¡Miau miau! 💕', (xs[0] + xs[1]) / 2, gy - 72, Math.min(1, (230 - G.timer) / 20));
}
// cx = centro, by = pies. Por defecto mira a la derecha (facing = -1 lo voltea)
function drawCat(cx, by, sc, facing, o) {
  const t = G.t * 0.06 + o.phase;
  ctx.save(); ctx.translate(cx, by); ctx.scale(sc * facing, sc);
  // cola
  ctx.strokeStyle = o.col; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-12, -8);
  ctx.quadraticCurveTo(-28, -12, -22 + Math.sin(t * (o.happy ? 3 : 1)) * 5, -30); ctx.stroke();
  // cuerpo sentado y patitas
  ctx.fillStyle = o.col; ell(-2, -11, 14, 11);
  if (o.belly) { ctx.fillStyle = o.belly; ell(5, -10, 6, 8); }
  ctx.fillStyle = o.paws || o.dark; ell(-11, -2, 5, 3); ell(8, -2, 5, 3);
  if (o.stripes) {
    ctx.strokeStyle = o.dark; ctx.lineWidth = 2;
    for (const sx of [-10, -4, 2]) { ctx.beginPath(); ctx.moveTo(sx, -20); ctx.quadraticCurveTo(sx - 2, -14, sx, -8); ctx.stroke(); }
  }
  // orejas
  ctx.fillStyle = o.col;
  ctx.beginPath(); ctx.moveTo(1, -30); ctx.lineTo(4, -44); ctx.lineTo(11, -34); ctx.fill();
  ctx.beginPath(); ctx.moveTo(13, -34); ctx.lineTo(19, -44); ctx.lineTo(21, -29); ctx.fill();
  ctx.fillStyle = '#ffb3c7';
  ctx.beginPath(); ctx.moveTo(4, -32); ctx.lineTo(5, -40); ctx.lineTo(9, -34); ctx.fill();
  ctx.beginPath(); ctx.moveTo(15, -34); ctx.lineTo(18, -40); ctx.lineTo(19, -31); ctx.fill();
  // cabeza
  ctx.fillStyle = o.col; circ(11, -25, 11);
  if (o.stripes) { ctx.fillStyle = o.dark; ctx.fillRect(8, -36, 2, 5); ctx.fillRect(14, -36, 2, 5); }
  if (o.blaze) {   // mancha blanca que baja de la frente al hocico
    ctx.fillStyle = o.blaze;
    ctx.beginPath(); ctx.moveTo(11, -33); ctx.lineTo(13, -33); ctx.lineTo(17, -21); ctx.lineTo(7, -21); ctx.fill();
    ell(12, -19.5, 7, 5);
  } else if (o.muzzle) { ctx.fillStyle = o.muzzle; ell(12, -19.5, 6.5, 4.5); }
  // ojos (parpadean de vez en cuando; felices = ojitos cerrados ^^)
  const blink = (G.t + o.phase * 40) % 180 < 8;
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1.8;
  if (o.happy || blink) {
    for (const ex of [7, 16]) { ctx.beginPath(); ctx.arc(ex, -25, 2.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  } else {
    ctx.fillStyle = o.eye || '#9be36b'; ell(7, -26, 2.8, 3.4); ell(16, -26, 2.8, 3.4);
    ctx.fillStyle = '#111'; ell(7.5, -26, 1.1, 2.8); ell(16.5, -26, 1.1, 2.8);
    ctx.fillStyle = '#fff'; circ(8, -27.5, 0.9); circ(17, -27.5, 0.9);
  }
  // nariz, boca y bigotes
  ctx.fillStyle = '#ff8fab';
  ctx.beginPath(); ctx.moveTo(10, -21.5); ctx.lineTo(14, -21.5); ctx.lineTo(12, -19.5); ctx.fill();
  ctx.lineWidth = 0.9; ctx.strokeStyle = '#6b4a4a';
  for (const mx of [10.6, 13.4]) { ctx.beginPath(); ctx.arc(mx, -19.3, 1.4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
  ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 0.9;
  for (const k of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(6, -20); ctx.lineTo(-3, -21 + k * 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(18, -20); ctx.lineTo(27, -21 + k * 3); ctx.stroke();
  }
  ctx.restore();
}

// ---------- Catedral de Santa María del Fiore (Florencia) ----------
// dx = centro de la puerta, gy = nivel del suelo. Se escala si el suelo está alto.
function drawDuomo(dx, gy) {
  const WH = '#f4efe3', GR = '#3f7a55', PK = '#e3a3a0', TC = '#c1502e';
  const k = Math.min(1, (gy - 64) / 465);   // la cruz de la linterna queda bajo la barra superior
  ctx.save(); ctx.translate(dx, gy); ctx.scale(k, k);
  // --- cúpula de Brunelleschi (detrás) ---
  const cx = 70;
  ctx.fillStyle = WH; ctx.fillRect(cx - 78, -250, 156, 70);                      // tambor
  ctx.fillStyle = GR; for (let i = 0; i < 6; i++) ctx.fillRect(cx - 74 + i * 28, -245, 4, 60);
  ctx.fillStyle = GR; ctx.fillRect(cx - 78, -252, 156, 5);
  ctx.fillStyle = '#1d3b2a'; for (let i = 0; i < 5; i++) circ(cx - 56 + i * 28, -218, 7); // óculos
  ctx.fillStyle = TC;
  ctx.beginPath(); ctx.moveTo(cx - 80, -250); ctx.quadraticCurveTo(cx - 76, -350, cx - 14, -385);
  ctx.lineTo(cx + 14, -385); ctx.quadraticCurveTo(cx + 76, -350, cx + 80, -250); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  ctx.beginPath(); ctx.moveTo(cx + 20, -250); ctx.quadraticCurveTo(cx + 40, -340, cx + 14, -385); ctx.lineTo(cx + 14, -385); ctx.quadraticCurveTo(cx + 76, -350, cx + 80, -250); ctx.fill();
  ctx.strokeStyle = WH; ctx.lineWidth = 4;                                        // nervios blancos
  for (const o of [-1, 0, 1]) {
    ctx.beginPath(); ctx.moveTo(cx + o * 52, -250); ctx.quadraticCurveTo(cx + o * 46, -345, cx + o * 12, -385); ctx.stroke();
  }
  ctx.fillStyle = WH; ctx.fillRect(cx - 16, -392, 32, 8);                         // linterna
  ctx.fillRect(cx - 10, -420, 20, 28);
  ctx.fillStyle = GR; ctx.fillRect(cx - 6, -414, 3, 18); ctx.fillRect(cx + 3, -414, 3, 18);
  ctx.fillStyle = WH; ctx.beginPath(); ctx.moveTo(cx - 11, -420); ctx.lineTo(cx, -446); ctx.lineTo(cx + 11, -420); ctx.fill();
  ctx.fillStyle = '#ffd84d'; circ(cx, -450, 5);
  ctx.fillRect(cx - 1, -462, 2, 10); ctx.fillRect(cx - 5, -458, 10, 2);
  // --- nave (entre fachada y cúpula) ---
  ctx.fillStyle = WH; ctx.fillRect(-20, -180, 150, 180);
  ctx.fillStyle = TC; ctx.fillRect(-20, -186, 150, 8);
  ctx.fillStyle = GR; for (let i = 0; i < 5; i++) ctx.fillRect(-10 + i * 30, -170, 4, 170);
  // --- fachada ---
  const fw = 170, fh = 210, fx = -fw / 2;
  ctx.fillStyle = WH; ctx.fillRect(fx, -fh, fw, fh);
  ctx.fillStyle = GR;
  for (const px of [fx, fx + 38, fx + fw - 44, fx + fw - 6]) ctx.fillRect(px, -fh, 6, fh);   // pilastras
  ctx.fillRect(fx, -fh, fw, 5); ctx.fillRect(fx, -128, fw, 4); ctx.fillRect(fx, -8, fw, 8);
  ctx.fillStyle = PK;                                                                 // paneles rosas
  for (const px of [fx + 12, fx + fw - 32]) { ctx.fillRect(px, -120, 16, 44); ctx.fillRect(px, -196, 16, 56); }
  ctx.fillStyle = GR;
  for (const px of [fx + 12, fx + fw - 32]) { ctx.fillRect(px + 6, -112, 4, 28); ctx.fillRect(px + 6, -188, 4, 40); }
  // frontón
  ctx.fillStyle = WH; ctx.beginPath(); ctx.moveTo(fx + 10, -fh); ctx.lineTo(0, -fh - 42); ctx.lineTo(-fx - 10, -fh); ctx.fill();
  ctx.strokeStyle = GR; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(fx + 10, -fh); ctx.lineTo(0, -fh - 42); ctx.lineTo(-fx - 10, -fh); ctx.stroke();
  ctx.fillStyle = '#d4af37'; circ(0, -fh - 18, 7);
  // rosetón
  ctx.fillStyle = GR; circ(0, -168, 24);
  ctx.fillStyle = '#6fa8dc'; circ(0, -168, 19);
  ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ctx.beginPath(); ctx.moveTo(0, -168); ctx.lineTo(Math.cos(a) * 18, -168 + Math.sin(a) * 18); ctx.stroke(); }
  ctx.fillStyle = '#e57373'; circ(0, -168, 5);
  // puertas laterales
  for (const px of [fx + 20, -fx - 20]) {
    ctx.fillStyle = GR; ctx.beginPath(); ctx.arc(px, -42, 13, Math.PI, 0); ctx.lineTo(px + 13, 0); ctx.lineTo(px - 13, 0); ctx.fill();
    ctx.fillStyle = '#5a3a22'; ctx.beginPath(); ctx.arc(px, -40, 9, Math.PI, 0); ctx.lineTo(px + 9, 0); ctx.lineTo(px - 9, 0); ctx.fill();
  }
  // puerta principal (por aquí entra el pato)
  ctx.fillStyle = GR; ctx.beginPath(); ctx.arc(0, -64, 30, Math.PI, 0); ctx.lineTo(30, 0); ctx.lineTo(-30, 0); ctx.fill();
  ctx.fillStyle = '#d4af37'; ctx.beginPath(); ctx.arc(0, -64, 22, Math.PI, 0); ctx.fill();          // mosaico dorado
  ctx.fillStyle = '#3d5a99'; ctx.beginPath(); ctx.arc(0, -64, 14, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#4a2c17'; ctx.fillRect(-20, -62, 40, 62);
  ctx.fillStyle = '#6b4226'; ctx.fillRect(-18, -60, 17, 60); ctx.fillRect(1, -60, 17, 60);
  ctx.fillStyle = '#d4af37'; circ(-4, -30, 2); circ(4, -30, 2);
  // --- campanile de Giotto (a la derecha) ---
  const bx = 150, bw = 44, bh = 330;
  ctx.fillStyle = WH; ctx.fillRect(bx, -bh, bw, bh);
  ctx.fillStyle = GR; ctx.fillRect(bx, -bh, 5, bh); ctx.fillRect(bx + bw - 5, -bh, 5, bh);
  for (const y of [-80, -150, -220, -290]) ctx.fillRect(bx, y, bw, 4);
  ctx.fillStyle = PK; for (const y of [-70, -140, -210]) ctx.fillRect(bx + 10, y, bw - 20, 8);
  ctx.fillStyle = '#1d3b2a';
  for (const y of [-120, -190]) { ctx.beginPath(); ctx.arc(bx + bw / 2, y, 7, Math.PI, 0); ctx.lineTo(bx + bw / 2 + 7, y + 18); ctx.lineTo(bx + bw / 2 - 7, y + 18); ctx.fill(); }
  ctx.fillRect(bx + 8, -280, 10, 40); ctx.fillRect(bx + bw - 18, -280, 10, 40);
  ctx.fillStyle = WH; ctx.fillRect(bx - 4, -bh - 8, bw + 8, 8);
  ctx.fillStyle = TC; ctx.fillRect(bx - 4, -bh - 12, bw + 8, 4);
  ctx.restore();
  txt('META', dx, gy - 72 * k - 12, 13, '#d4af37', 'center', '#1d3b2a');
}

// ---------- Escenario de la rave ----------
function drawRave(gy) {
  const pos = ravePos(), b = pos.b, beat = raveBeat(), pulse = 1 - (beat % 1);
  const k = G.screen === 'clear' && G.raveArrive != null ? G.timer - G.raveArrive : -1;
  const party = k > 60;
  const sx0 = b + 0.3 * T, sx1 = b + 8.6 * T, top = Math.max(gy - 230, 92), st = gy - 24;
  // láseres (recortados para que no atraviesen el suelo)
  ctx.save(); ctx.beginPath(); ctx.rect(cam.x, 0, W, gy); ctx.clip();
  ctx.globalCompositeOperation = 'lighter'; ctx.lineWidth = 3;
  const nL = party ? 9 : 4;
  for (let i = 0; i < nL; i++) {
    const ox = sx0 + 20 + i * (sx1 - sx0 - 40) / (nL - 1);
    const a = Math.sin(G.t * (party ? 0.05 : 0.02) + i * 1.3) * 1.1;
    ctx.strokeStyle = `hsla(${(i * 50 + G.t * 3) % 360},100%,60%,${0.3 + pulse * 0.35})`;
    ctx.beginPath(); ctx.moveTo(ox, top + 12); ctx.lineTo(ox + Math.sin(a) * 700, top + 12 + Math.cos(a) * 700); ctx.stroke();
  }
  const bx = (sx0 + sx1) / 2;
  ctx.fillStyle = `rgba(140,255,90,${0.05 + pulse * (party ? 0.12 : 0.05)})`;
  ctx.beginPath(); ctx.moveTo(bx, top + 50); ctx.lineTo(bx - 200, st); ctx.lineTo(bx + 200, st); ctx.fill();
  ctx.restore();
  // estructura y letrero
  ctx.fillStyle = '#2b2f33';
  ctx.fillRect(sx0, top, 6, st - top); ctx.fillRect(sx1 - 6, top, 6, st - top); ctx.fillRect(sx0, top, sx1 - sx0, 12);
  ctx.strokeStyle = '#4a5157'; ctx.lineWidth = 1.5;
  for (let x = sx0; x < sx1 - 12; x += 12) { ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x + 12, top + 12); ctx.stroke(); }
  ctx.save(); ctx.shadowColor = `hsl(${G.t * 3 % 360},100%,60%)`; ctx.shadowBlur = 20;
  txt('☢ RADIACTIVE RAVE ☢', bx, top - 8, 22, `hsl(${G.t * 3 % 360},100%,70%)`, 'center', '#111');
  ctx.restore();
  // bola de discoteca
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(bx, top + 12); ctx.lineTo(bx, top + 40); ctx.stroke();
  ctx.fillStyle = '#cfd8dc'; circ(bx, top + 54, 15);
  ctx.fillStyle = '#90a4ae';
  for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) if ((i + j + Math.floor(G.t / 6)) % 2 === 0 && i * i + j * j < 6) ctx.fillRect(bx + i * 5 - 2, top + 54 + j * 5 - 2, 4, 4);
  ctx.fillStyle = '#fff'; for (let i = 0; i < 3; i++) { const a = G.t * 0.1 + i * 2.1; circ(bx + Math.cos(a) * 11, top + 54 + Math.sin(a) * 11, 1.8); }
  // DJ detrás de la mesa (sobre una plataforma para que se vea)
  drawDuck(b + 3.9 * T, st - 24 - Math.abs(Math.sin(beat * Math.PI)) * 3, 1.4, -1, { skin: 'dj', flap: party || Math.floor(beat) % 4 === 3 });
  // tarima
  ctx.fillStyle = '#1c1f22'; ctx.fillRect(sx0, st, sx1 - sx0, 24);
  for (let i = 0; i < 16; i++) { ctx.fillStyle = `hsla(${(i * 25 + beat * 90) % 360},100%,60%,${0.4 + pulse * 0.6})`; circ(sx0 + 10 + i * (sx1 - sx0 - 20) / 15, st + 12, 3); }
  // mesa del DJ con tornamesas
  const tx = b + 2.5 * T, tw = 3 * T;
  ctx.fillStyle = '#111'; ctx.fillRect(tx, st - 34, tw, 34);
  ctx.fillStyle = `hsl(${beat * 90 % 360},100%,55%)`; ctx.fillRect(tx + 6, st - 22, tw - 12, 3);
  ctx.fillStyle = '#333'; ctx.fillRect(tx - 4, st - 38, tw + 8, 5);
  for (const dx of [tx + 18, tx + tw - 18]) {
    ctx.fillStyle = '#222'; ell(dx, st - 40, 15, 4.5);
    ctx.strokeStyle = '#777'; ctx.lineWidth = 1; const a = G.t * 0.3;
    ctx.beginPath(); ctx.moveTo(dx, st - 40); ctx.lineTo(dx + Math.cos(a) * 13, st - 40 + Math.sin(a) * 4); ctx.stroke();
  }
  ctx.fillStyle = '#3a3a3a'; ctx.fillRect(tx + tw / 2 - 9, st - 44, 18, 6);
  // bocinas
  for (const spx of [sx0 + 4, sx1 - 40]) {
    ctx.fillStyle = '#111'; ctx.fillRect(spx, st - 76, 36, 76);
    ctx.fillStyle = '#333'; circ(spx + 18, st - 26, 13 + pulse * 2.5); circ(spx + 18, st - 60, 7 + pulse);
    ctx.fillStyle = '#111'; circ(spx + 18, st - 26, 5); circ(spx + 18, st - 60, 2.5);
  }
  // patos bailando
  pos.dancers.forEach((x, i) => {
    const jump = party ? Math.abs(Math.sin((beat + i * 0.25) * Math.PI)) * 34 : Math.abs(Math.sin(beat * Math.PI)) * 5;
    const face = Math.floor(beat / 2 + i) % 2 ? 1 : -1;
    drawDuck(x, gy - jump, 1.15, face, { skin: RAVE_DANCERS[i], flap: party || jump > 3 });
  });
  // la pata (se inclina para dar el beso)
  const lean = k >= 8 && k < 40 ? -Math.sin((k - 8) / 32 * Math.PI) * 7 : 0;
  const pj = party ? Math.abs(Math.sin((beat + 0.5) * Math.PI)) * 18 : 0;
  drawDuck(pos.pata + lean, gy - pj, 1.15, -1, { skin: 'pata', flap: party });
  if (k >= 20 && k < 130) drawBubble('¡Muak! 💋', pos.pata, gy - 28 - pj, Math.min(1, (130 - k) / 20));
  if (k >= 22 && k < 200) { ctx.globalAlpha = Math.min(1, (200 - k) / 30); txt('💋', player.x + player.w / 2 + 12, player.y + 8, 14, '#fff', 'center', null); ctx.globalAlpha = 1; }
}

function drawSpeech(p) {
  if (!p.speech || p.hidden) return;
  drawBubble(p.speech.text, p.speech.ax ?? p.x + p.w / 2, p.speech.ay ?? p.y, Math.min(1, p.speech.t / 20));
}
// letrero sobre un personaje: hx = centro, headY = parte de arriba de la cabeza
function drawBubble(text, hx, headY, alpha) {
  ctx.font = `bold 16px ${FONT}`;
  const tw = ctx.measureText(text).width, bw = tw + 22, bh = 30;
  const bx = clamp(hx - bw / 2, cam.x + 6, cam.x + W - bw - 6);
  const by = Math.max(56, headY - bh - 16);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
  rrect(bx, by, bw, bh, 12); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx - 6, by + bh - 1); ctx.lineTo(hx + 2, by + bh + 12); ctx.lineTo(hx + 8, by + bh - 1); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx - 6, by + bh); ctx.lineTo(hx + 2, by + bh + 12); ctx.lineTo(hx + 8, by + bh); ctx.stroke();
  txt(text, bx + bw / 2, by + 21, 16, '#222', 'center', null);
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const p = player;
  if (p.hidden) return;
  if (!p.dead && p.inv > 0 && Math.floor(p.inv / 4) % 2 === 0) return;
  let sc = p.state === 0 ? 1 : 1.42;
  if (p.growT > 0 && Math.floor(p.growT / 5) % 2 === 0) sc *= p.state === 0 ? 1.3 : 0.8;
  const moving = p.onGround && Math.abs(p.vx) > 0.3;
  const bob = moving ? Math.abs(Math.sin(p.anim)) * 2 : 0;
  const air = !p.onGround && !p.dead;
  drawDuck(p.x + p.w / 2, p.y + p.h - bob, sc, p.facing, {
    skin: skinOf(G.world), rad: p.state === 2, flap: air, dead: p.dead,
    sx: air ? 0.94 : 1, sy: air ? 1.07 : 1,
  });
}

// =====================================================================
//  Dibujo: mundo y HUD
// =====================================================================
function renderWorld() {
  const cx = Math.round(cam.x);
  drawBackground(cx, TH);
  ctx.save(); ctx.translate(-cx, 0);

  const c0 = Math.max(0, Math.floor(cx / T) - 1), c1 = Math.min(L.cols - 1, c0 + Math.ceil(W / T) + 2);
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
    const t = L.grid[r][c]; if (!t) continue;
    const b = bumps.get(c + ',' + r);
    drawTile(t, c * T, r * T - (b ? Math.sin((b / 10) * Math.PI) * 8 : 0), c, r, L.grid);
  }
  if (TH.pit) {
    const col = { water: 'rgba(40,140,230,.85)', lava: '#ff5a1a', toxic: '#6fe82e', ice: 'rgba(170,215,255,.9)' }[TH.pit];
    for (let c = c0; c <= c1; c++) if (L.grid[ROWS - 1][c] === 0) {
      const y = H - 38 + Math.sin(G.t * 0.08 + c) * 3;
      ctx.fillStyle = col; ctx.fillRect(c * T, y, T + 1, H - y);
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(c * T, y, T + 1, 3);
    }
  }
  drawFlagAndTub();
  for (const pl of plats) {
    ctx.fillStyle = '#e0e0e0'; rrect(pl.x, pl.y, pl.w, pl.h, 6); ctx.fill();
    ctx.fillStyle = '#9aa7b5'; ctx.fillRect(pl.x + 4, pl.y + pl.h - 4, pl.w - 8, 3);
    ctx.fillStyle = '#ff7ab8'; for (let k = 0; k < pl.w / T; k++) circ(pl.x + 16 + k * 32, pl.y + 6, 3);
  }
  coins.forEach(c => drawCoin(c.x + 10, c.y + 10, c.x * 0.02));
  buttons.forEach(b => { if (!b.taken) drawButton(b); });
  enemies.forEach(e => { if (e.active || e.x < cx + W + 80) drawEnemy(e); });
  for (const f of fireballs) {
    ctx.save(); ctx.shadowColor = '#7dff3a'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#b6ff6a'; circ(f.x + 6, f.y + 6, 7); ctx.fillStyle = '#fff'; circ(f.x + 6, f.y + 6, 3);
    ctx.restore();
  }
  drawPlayer();
  for (const q of particles) {
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    if (q.coin) drawCoin(q.x, q.y, 0);
    else if (q.heart) txt('♥', q.x, q.y, 18, '#ff4f8b', 'center', null);
    else { ctx.fillStyle = q.c; if (q.sq) ctx.fillRect(q.x - q.r, q.y - q.r, q.r * 2, q.r * 2); else circ(q.x, q.y, q.r); }
  }
  ctx.globalAlpha = 1;
  for (const q of popups) txt(q.text, q.x + 12, q.y, 15, q.color);
  drawSpeech(player);
  ctx.restore();

  for (const q of amb) { ctx.fillStyle = q.c; circ(q.x, q.y, q.r); }
  if (TH.deco === 'crystals' || TH.deco === 'factory') {
    // viñeta oscura
    const p = player, sx = p.x + p.w / 2 - cx, sy = p.y + p.h / 2;
    const g = ctx.createRadialGradient(sx, sy, 120, sx, sy, 560);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  drawHUD();
  if (G.msg) {
    ctx.globalAlpha = Math.min(1, G.msg.t / 20);
    txt(G.msg.text, W / 2, 110, 30, '#ffe45c');
    ctx.globalAlpha = 1;
  }
}

function drawHUD() {
  const p = player;
  ctx.fillStyle = 'rgba(0,0,0,.42)'; ctx.fillRect(0, 0, W, 52);
  txt(`MUNDO ${G.world + 1}`, 16, 23, 20, '#fff', 'left');
  txt(`${TH.name} · ${SKIN_NOMBRES[skinOf(G.world)]}`, 16, 44, 14, '#ffe27a', 'left');
  txt(`⏱ ${Math.floor(G.time / 60)}s`, 140, 23, 18, '#fff', 'left');
  for (let i = 0; i < 2; i++) {
    const bx = W / 2 - 18 + i * 36;
    ctx.globalAlpha = i < G.buttons ? 1 : 0.28;
    drawButtonIcon(bx, 18, 12, i);
    ctx.globalAlpha = 1;
  }
  // barra de progreso con la posición de los botones
  const bx = W / 2 - 140, bw = 280, by = 38;
  ctx.fillStyle = 'rgba(255,255,255,.25)'; rrect(bx, by, bw, 6, 3); ctx.fill();
  const prog = clamp(p.x / L.flagX, 0, 1);
  ctx.fillStyle = '#ffd21f'; rrect(bx, by, Math.max(6, bw * prog), 6, 3); ctx.fill();
  for (const b of buttons) if (!b.taken) drawButtonIcon(bx + bw * clamp(b.x / L.flagX, 0, 1), by + 3, 5, b.idx);
  ctx.fillStyle = '#fff'; ctx.fillRect(bx + bw - 2, by - 6, 3, 14);
  drawDuck(bx + bw * prog, by + 9, 0.5, 1, { rad: p.state === 2, skin: skinOf(G.world) });

  txt(`🦆 x${G.lives}`, W - 290, 23, 18, '#fff', 'left');
  txt(`🪙 ${G.coins}`, W - 200, 23, 18, '#fff', 'left');
  txt(String(G.score).padStart(7, '0'), W - 16, 23, 18, '#fff', 'right');
  const st = [['Pato normal', '#fff'], ['Pato grande (1 botón)', '#ffd21f'], ['☢ PATO RADIACTIVO', '#8cff3a']][p.state];
  txt(st[0], W - 16, 44, 14, st[1], 'right');
  txt(muted ? '🔇' : '🔊', W - 290, 44, 12, '#fff', 'left', null);
}

// =====================================================================
//  Pantallas
// =====================================================================
function drawGroundStrip(off) {
  const o = off % T;
  for (let c = -1; c < W / T + 2; c++) for (let r = 13; r < ROWS; r++) drawTile(r === 13 ? 1 : 2, c * T - o, r * T, c + Math.floor(off / T), r, null);
}
function renderTitle() {
  TH = THEMES[G.sel];
  const off = G.t * 1.2;
  drawBackground(off, TH);
  drawGroundStrip(off);
  for (const q of amb) { ctx.fillStyle = q.c; circ(q.x, q.y, q.r); }
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, 0, W, H);

  const rad = Math.floor(G.t / 150) % 3;
  drawDuck(W / 2, 13 * T - Math.abs(Math.sin(G.t * 0.08)) * 18, rad === 0 ? 3 : 3.8, 1, { rad: rad === 2, flap: true, skin: skinOf(G.sel) });
  if (rad === 2 && G.t % 3 === 0) particles.push({ x: W / 2 + (Math.random() - 0.5) * 100, y: 13 * T - Math.random() * 90, vx: 0, vy: -1, life: 30, max: 30, c: '#9dff5a', r: 3, g: 0 });
  for (const q of particles) { ctx.globalAlpha = q.life / q.max; ctx.fillStyle = q.c; circ(q.x, q.y, q.r); }
  ctx.globalAlpha = 1;
  drawButtonIcon(W / 2 - 200, 13 * T - 20, 16, 0);
  drawButtonIcon(W / 2 + 200, 13 * T - 20, 16, 1);

  txt('PATO DE HULE', W / 2, 110, 70, '#ffd21f', 'center', '#5a3a00');
  txt('y los dos botones', W / 2, 150, 26, '#fff');
  txt(`◀   MUNDO ${G.sel + 1}: ${TH.name}   ▶`, W / 2, 215, 24, '#fff');
  txt(SKIN_NOMBRES[skinOf(G.sel)], W / 2, 243, 18, '#ffe27a');
  if (G.unlocked > 1) txt(`Mundos desbloqueados: ${G.unlocked} / 8`, W / 2, 262, 13, '#ddd');
  if (Math.floor(G.t / 30) % 2 === 0) txt(IS_TOUCH ? 'Toca la pantalla para jugar' : 'Pulsa ENTER o ESPACIO para jugar', W / 2, 292, 22, '#ffe45c');
  txt(IS_TOUCH ? '◀ ▶ mover   ·   ⤒ saltar   ·   🔥 fuego (radiactivo)   ·   ⏸ pausa'
    : '← → mover   ·   ESPACIO / ↑ saltar   ·   X disparar fuego (radiactivo)   ·   P pausa   ·   M sonido', W / 2, 470, 14, '#fff');
  txt(`Consigue los 2 botones y llega a ${goalName(G.sel)}`, W / 2, 496, 14, '#ffe27a');
}
function renderIntro() {
  ctx.fillStyle = '#0d0d14'; ctx.fillRect(0, 0, W, H);
  txt(`MUNDO ${G.world + 1}`, W / 2, 190, 56, '#ffd21f');
  txt(THEMES[G.world].name, W / 2, 235, 26, '#fff');
  txt(`Skin: ${SKIN_NOMBRES[skinOf(G.world)]}`, W / 2, 262, 18, '#ffe27a');
  drawDuck(W / 2 - 40, 320, 1.6, 1, { skin: skinOf(G.world) });
  txt(`x ${G.lives}`, W / 2 + 30, 312, 28, '#fff', 'left');
  drawButtonIcon(W / 2 - 16, 380, 12, 0); drawButtonIcon(W / 2 + 16, 380, 12, 1);
  txt(`Encuentra los 2 botones y llega a ${goalName(G.world)}`, W / 2, 420, 18, '#ddd');
}
function renderOverlay(title, sub, color) {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
  txt(title, W / 2, H / 2 - 20, 60, color);
  if (sub) txt(sub, W / 2, H / 2 + 30, 20, '#fff');
}
function renderWin() {
  TH = THEMES[0];
  drawBackground(G.t, TH);
  drawGroundStrip(G.t);
  if (G.t % 5 === 0) particles.push({ x: Math.random() * W, y: -10, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 2, life: 200, max: 200, c: `hsl(${Math.random() * 360},90%,60%)`, r: 4, g: 0.02, sq: true });
  for (const q of particles) { ctx.fillStyle = q.c; ctx.fillRect(q.x, q.y, 6, 6); }
  drawDuck(W / 2, 13 * T - Math.abs(Math.sin(G.t * 0.1)) * 30, 4, 1, { rad: true, flap: true, skin: SKIN_POR_MUNDO[Math.floor(G.t / 90) % SKIN_POR_MUNDO.length] });
  txt('¡GANASTE!', W / 2, 130, 72, '#ffd21f', 'center', '#5a3a00');
  txt('El pato radiactivo conquistó los 8 mundos', W / 2, 175, 24, '#fff');
  txt(`Puntos: ${G.score}   ·   Monedas: ${G.coins}`, W / 2, 215, 22, '#fff');
  if (G.timer > 60 && Math.floor(G.t / 30) % 2 === 0) txt(IS_TOUCH ? 'Toca la pantalla para volver al inicio' : 'Pulsa ENTER para volver al inicio', W / 2, 500, 20, '#ffe45c');
}

function render() {
  ctx.clearRect(0, 0, W, H);
  switch (G.screen) {
    case 'title': renderTitle(); break;
    case 'intro': renderIntro(); break;
    case 'play': case 'clear': renderWorld();
      if (G.screen === 'clear') {
        txt('¡MUNDO COMPLETADO!', W / 2, 150, 44, '#7dff7d');
        txt(`Tiempo: ${(G.time / 60).toFixed(1)} s`, W / 2, 190, 24, '#fff');
      }
      break;
    case 'pause': renderWorld(); renderOverlay('PAUSA', IS_TOUCH ? 'Toca la pantalla para continuar' : 'Pulsa P para continuar', '#fff'); break;
    case 'gameover': renderWorld(); renderOverlay('GAME OVER', G.timer > 60 ? `Puntos: ${G.score}  ·  ${IS_TOUCH ? 'Toca la pantalla' : 'Pulsa ENTER'}` : '', '#ff5a5a'); break;
    case 'win': renderWin(); break;
  }
}

// =====================================================================
//  Bucle principal (paso fijo a 60 fps)
// =====================================================================
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
