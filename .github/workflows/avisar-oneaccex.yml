name: avisar-oneaccex
on:
  push:
    tags: ['v*']
jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar en patogame.oneaccex.com
        env:
          TOKEN: ${{ secrets.ONEACCEX_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/oneaccex/patogame/actions/workflows/publicar.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"tag\":\"$TAG\"}}"